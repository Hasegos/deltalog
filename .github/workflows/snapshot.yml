name: Deltalog Snapshot

on:
  workflow_run:
    workflows: ["Check and Deploy"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 셋팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 정기 실행은 서버가 꺼져 있으면 건너뛰고, 배포된 스냅샷과 같으면 배포하지 않는다 (dist가 비어 있으면 아래 단계도 건너뛴다)
      - name: 스냅샷 굽기
        run: python scripts/bake_snapshot.py dist
        env:
          SKIP_IF_DOWN: ${{ github.event_name == 'schedule' && '1' || '0' }}
          SNAPSHOT_WAIT: ${{ github.event_name == 'schedule' && '20' || '180' }}
          SNAPSHOT_URL: ${{ github.event_name == 'schedule' && 'https://deltalog-snapshot.pages.dev' || '' }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}

      - name: Cloudflare Pages 배포
        if: hashFiles('dist/**') != ''
        run: npx --yes wrangler@4 pages deploy dist --project-name deltalog-snapshot --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}