<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_desc }}">
<link rel="canonical" href="{{ canonical_url(request) }}">
{% if noindex or request.url.query %}<meta name="robots" content="noindex,follow">{% endif %}
<meta property="og:site_name" content="Deltalog">
<meta property="og:locale" content="ko_KR">
<meta property="og:type" content="{{ seo_type or 'website' }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_desc }}">
<meta property="og:url" content="{{ canonical_url(request) }}">
<meta property="og:image" content="{{ site_url(request) }}/static/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site_url(request) }}/static/img/og.png">
<link rel="alternate" type="application/rss+xml" title="Deltalog" href="/feed.xml">
<link rel="icon" href="{{ asset('img/favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="{{ asset('img/apple-touch-icon.png') }}">
{% if jsonld %}<script type="application/ld+json">{{ jsonld | safe }}</script>{% endif %}
{% if adsense_client %}<meta name="google-adsense-account" content="{{ adsense_client }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client }}" crossorigin="anonymous"></script>{% endif %}
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{ asset('css/common.css') }}">
<script src="{{ asset('js/theme.js') }}" defer></script>
