{% macro spark(s, label) %}
<svg class="spark{{ ' empty' if not s.total }}" viewBox="0 0 96 24" preserveAspectRatio="none" role="img" aria-label="{{ label }}: {{ s.counts | join(', ') }}">
  <polygon points="{{ s.points }} 94,24 2,24" fill="currentColor" fill-opacity=".12" stroke="none"/>
  <polyline points="{{ s.points }}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
</svg>
{% endmacro %}
