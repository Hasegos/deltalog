<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deltalog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="mono">▲</span><i>/</i>Deltalog</a>
    <nav class="nav">
      <a href="/#tools">도구</a>
      <a href="/#topics">주제</a>
      <a href="/#about">소개</a>
    </nav>
    <details class="menu">
      <summary aria-label="메뉴">☰</summary>
      <div>
        <a href="/#tools">도구</a>
        <a href="/#topics">주제</a>
        <a href="/#about">소개</a>
      </div>
    </details>
  </header>
  {% block content %}{% endblock %}
  <footer class="foot" id="about">
    <span>Deltalog</span>
    <span>소개</span>
    <span>문의</span>
    <a href="https://github.com/Hasegos/deltalog">GitHub</a>
  </footer>
</body>
</html>
