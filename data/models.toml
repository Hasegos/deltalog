# AI API 모델 가격 · 한도 원본. 사람이 공식 문서를 보고 고치고, 바뀐 내용은 `git diff data/models.toml`로 본다.
# 확인하지 못한 값은 키를 지운다 (화면에 "미확인"으로 보인다). 추측해서 채우지 않는다.
# 수록 기준 (Anthropic): 공식 가격 페이지의 현역(Active) · 폐기 예고(Deprecated) 모델만 넣고, 종료(Retired) 모델과 limited availability 모델(Mythos 계열)은 뺀다. OpenAI · Google은 아직 이 기준으로 대조하지 않았다.
#
# 필드
#   provider          Anthropic / OpenAI / Google (종료 일정의 제공사 이름과 같다)
#   id                주소(/models/<id>)와 API 모델 이름. 소문자, 숫자, 점, 하이픈
#   name              화면에 보이는 이름
#   aliases           종료 일정 문서가 쓰는 다른 이름 (날짜가 붙은 ID 등). 종료 일정과 이어 붙일 때만 쓴다
#   input_per_mtok    입력 100만 토큰당 USD (기본 단가)
#   output_per_mtok   출력 100만 토큰당 USD (기본 단가)
#   context_tokens    컨텍스트 창 크기(토큰)
#   max_output_tokens 한 번에 낼 수 있는 최대 출력(토큰)
#   note              가격이 달라지는 조건 (구간 단가, 예고된 인상 등). 계산기는 기본 단가만 쓴다
#   retire_not_before 제공사 폐기 안내 문서가 "Not sooner than"으로만 밝힌 잠정 날짜(YYYY-MM-DD). 확정 종료일이 아니며 확정 일정이 수집되면 그쪽이 먼저 보인다
#   source_url        가격을 확인한 공식 페이지
#   spec_url          한도를 확인한 공식 모델 페이지
#   verified_at       위 값을 공식 페이지에서 확인한 날짜
#   use_when, avoid_when, migration, notes   상세 페이지에 얹는 편집 콘텐츠(문장 목록). 공식 문서로 근거를 댈 수 있는 내용만, 모델마다 다르게 쓴다. 같은 문장을 다른 모델에 쓰면 로드가 실패한다
#   compare_with      비교할 모델 id 목록. 단가 · 컨텍스트 · 종료 예정은 데이터에서 읽어 와서 표로 보인다
#   evidence_urls     편집 콘텐츠의 근거 링크(https). 검수한 모델은 필수다
#   reviewed, reviewed_at   사람이 읽고 검수했는지(true/false)와 검수일. true인 모델에만 위 내용이 화면에 보인다. 초안은 false로 둔다
#   (migration에 적는 계산값은 문장 안에 '추정'이라고 밝힌다)
# 종료일은 여기에 적지 않는다. 종료 일정 수집(deadline 테이블)에서 가져와 붙인다.

